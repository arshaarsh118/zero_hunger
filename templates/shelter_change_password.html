<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter - Change Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #ffc107;
        }

        form {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        table {
            width: 100%;
        }

        table td {
            padding: 10px 0;
        }

        input {
            display: block;
            width: 100%;
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-size: 1rem;
            margin-top: 5px;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 4px #ffc107;
        }

        input[type="submit"] {
            background-color: #ffc107;
            color: #121212;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #ffcd39;
        }

        @media (max-width: 600px) {
            form {
                padding: 15px;
            }

            h2 {
                font-size: 1.5rem;
            }

            input {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <center>
        <form action="" method="post">
            <h2>Change Password</h2>
            <table>
                <tr>
                    <td>
                        <input type="password" name="password" class="form-control" placeholder="New Password" required minlength="6" title="Password must be at least 6 characters">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="password" name="password1" class="form-control" placeholder="Confirm Password" required minlength="6" title="Password must be at least 6 characters">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" name="update" value="Change Password" class="btn btn-warning w-100">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
