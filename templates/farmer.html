<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h2 {
            margin-bottom: 20px;
            color: #ffcc00;
        }
        table {
            width: 100%;
        }
        table td {
            padding: 10px;
            vertical-align: middle;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #2c2c2c;
            color: #ffffff;
        }
        input:focus {
            outline: none;
            border-color: #ffcc00;
        }
        .btn-warning {
            background-color: #ffcc00;
            border: none;
            color: #121212;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-warning:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <center>
            <h2>Farmer Registration</h2>
            <form action="" method="post">
                <table>
                    <tr>
                        <td>Full Name:</td>
                        <td><input type="text" name="fname" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Place:</td>
                        <td><input type="text" name="place" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Pincode:</td>
                        <td><input type="text" name="pin" class="form-control" required pattern="[0-9]{6}" title="Pincode must be 6 digits"></td>
                    </tr>
                    <tr>
                        <td>Date Of Birth:</td>
                        <td>
                            <input type="date" id="dob" name="dob" class="form-control" required>
                            <span id="dob-error" style="color: red;"></span>
                        </td>
                    </tr>
                    
                    <script>
                        document.getElementById("dob").addEventListener("change", function() {
                            let dobInput = this.value;
                            let dob = new Date(dobInput);
                            let today = new Date();
                            
                            let age = today.getFullYear() - dob.getFullYear();
                            let monthDiff = today.getMonth() - dob.getMonth();
                            let dayDiff = today.getDate() - dob.getDate();
                            
                            // Adjust age calculation if birthday hasn't occurred this year
                            if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
                                age--;
                            }
                    
                            let errorMsg = document.getElementById("dob-error");
                    
                            if (age < 18) {
                                errorMsg.textContent = "You must be at least 18 years old.";
                                this.value = ""; // Clear input field
                            } else {
                                errorMsg.textContent = "";
                            }
                        });
                    </script>
                    
                    <tr>
                        <td>Phone:</td>
                        <td><input type="text" name="phone" class="form-control" required pattern="[0-9]{10}" title="Phone number must be 10 digits"></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="email" name="email" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>User Name:</td>
                        <td><input type="text" name="uname" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password" name="password" class="form-control" required minlength="6" title="Password must be at least 6 characters long"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <input type="submit" name="submit" value="Submit" class="btn btn-warning">
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </div>
</body>
</html>
