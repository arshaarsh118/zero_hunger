<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card View</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            width: 250px;
            padding: 15px;
            overflow: hidden;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffffff;
        }
        .card p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #bdbdbd;
        }
        .card video {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <center>
        {% if data['view'] %}
    <div class="card-container">
        {% for i in data['view'] %}
        <div class="card">
            <h3>{{ i['title'] }}</h3>
            <p>{{ i['description'] }}</p>
            <video src="{{ i['file_path'] }}" controls></video>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p>No videos available at the moment.Please check back later for any updates or new submissions.</p>
    {% endif %}
    </center>
</body>
</html>
<br><br><br><br><br><br><br><br>
