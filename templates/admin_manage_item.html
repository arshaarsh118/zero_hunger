{% include 'admin_header.html' %}
<br><br><br><br><br>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin_manage_item</title>
</head>
<body>
    <center>
        {% if data['up'] %}
        <h2>ADD ITEMS</h2>
        <form action="" method="post">
            <table>
                <tr>
                
                    <td><input type="text" name="item" placeholder="Item Name" class="form-control" value="{{data['up'][0]['item_name']}}"></td>
                </tr>
                <tr>
                    <td>Price:</td>
                    <td><input type="text" name="price" placeholder="Price" class="form-control" value="{{data['up'][0]['item_price']}}"></td>
                </tr>
                <tr>
                  
                        <td><input type="submit" name="update" value="Update" class="btn btn-warning w-100"></td>
               
                </tr>
            </table>
        </form>
        {% else %}
        
<form action="" method="post">
    <h2>ADD ITEMS</h2>
    <div class="form-group">
        <label for="item">Item Name:</label>
        <input type="text" name="item" id="item" class="form-control" placeholder="Item Name" required>
    </div>
    <div class="form-group">
        <label for="price">Price:</label>
        <input type="text" name="price" id="price" class="form-control" placeholder="Price Per Kg" required>
    </div>
    <div class="form-group">
        <button type="submit" name="submit" class="btn btn-warning w-100">Add</button>
    </div>
</form>

<style>
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    form {
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
        background-color: #0e0c0c;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-size: 16px;
        margin-bottom: 5px;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #ddd;
        font-size: 16px;
    }

    .form-control:focus {
        border-color: #007bff;
        outline: none;
    }

    .btn {
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-warning {
        background-color: #ffc107;
        color: white;
    }

    .btn-warning:hover {
        background-color: #e0a800;
    }

    .w-100 {
        width: 100%;
    }
</style>

        <br><br><br>
        
        <table class="table table-dark table-striped"  style="width: 50%;">
            <thead>
                <tr>
                    <th scope="col">Item Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Update Details</th>
                    <th scope="col">Delete Details</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data['view'] %}
                <tr>
                    <td>{{ i['item_name'] }}</td>
                    <td>{{ i['item_price'] }}</td>
                    <td>
                        <div class="d-flex justify-content-between">
                            <a href="?action=update&id={{i['item_id']}}" class="btn btn-primary btn-sm">Update</a>
                            
                        </div>
                    </td>
                    <td>
                        <div class="d-flex justify-content-between">
                           
                            <a href="?action=delete&id={{i['item_id']}}" class="btn btn-danger btn-sm">Delete</a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        {% endif %}
    </center>
</body>
</html>
<br><br><br><br><br><br><br><br>
