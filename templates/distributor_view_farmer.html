{% include 'distributor_header.html'%}
<br><br><br><br>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor View Farmer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #080808;
            color: #212529;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 20px;
            margin-bottom: 30px;
            color: #343a40;
            font-weight: bold;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        p {
            margin-top: 50px;
            font-size: 1.1rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <center>
            {% if data['view'] %}
            <h2><i class="fas fa-seedling"></i> Farmers</h2>
            <div class="row justify-content-center">
                {% for i in data['view'] %}
                <div class="col-md-4 mb-4">
                    <div class="card text-white bg-dark">
                        <div class="card-body text-center">
                            <h5 class="card-title">{{ i['farmer_name'] }}</h5>
                            <a href="/distributor_search_item?id={{ i['farmer_id'] }}" class="btn btn-primary">
                                <i class="fas fa-eye"></i> View Items
                            </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p>
                <i class="fas fa-exclamation-circle"></i> No farmers available at the moment. Please check back later for any updates or new submissions.
            </p>
            {% endif %}
        </center>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
