{% include 'admin_header.html' %}
<br><br><br><br><br><br>    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin_manage_video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            width: 300px;
            padding: 15px;
            overflow: hidden;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffffff;
        }
        .card p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #bdbdbd;
        }
        .card video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .card .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .card .actions a {
            text-decoration: none;
            color: #ffffff;
        }
        .card .actions button {
            background-color: #333;
            border: none;
            padding: 10px 15px;
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
        }
        .card .actions button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <center>
        {% if data['up'] %}
        <h2> Update Videos</h2>
        <form action="" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td>Title:</td>
                    <td><input type="text" name="title" class="form-control" value="{{data['up'][0]['title']}}"></td>
                </tr>
                <tr>
                    <td>Description:</td>
                    <td><textarea name="dis" class="form-control">{{data['up'][0]['description']}}</textarea></td>
                </tr>
                <tr>
                    <td>File:</td>
                    <td><input type="file" name="file" class="form-control" value="{{data['up'][0]['file_path']}}"></td>
                </tr>
                <tr>
                    <td>File type:</td>
                    <td><input type="text" name="filetype" class="form-control" value="{{data['up'][0]['file_type']}}"></td>
                </tr>
                <tr>
                    <th>
                        <td><input type="submit" name="update" value="Upload" class="btn btn-warning"></td>
                    </th>
                </tr>
            </table>
        </form>
        {% else %}
        
<form action="" method="post" enctype="multipart/form-data">
    <h2> Add Videos</h2>
    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" class="form-control" placeholder="Video Title" required>
    </div>
    <div class="form-group">
        <label for="dis">Description:</label>
        <textarea name="dis" id="dis" class="form-control" placeholder="Video Description" required></textarea>
    </div>
    <div class="form-group">
        <label for="file">File:</label>
        <input type="file" name="file" id="file" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="filetype">File Type:</label>
        <input type="text" name="filetype" id="filetype" class="form-control" placeholder="File Type (e.g., mp4)" required>
    </div>
    <div class="form-group">
        <button type="submit" name="submit" class="btn btn-warning w-100">Upload</button>
    </div>
</form>

<style>
    h2 {
    text-align: center;
    margin-bottom: 20px;
    color: black;
}


    form {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-size: 16px;
        margin-bottom: 5px;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #ddd;
        font-size: 16px;
    }

    .form-control:focus {
        border-color: #007bff;
        outline: none;
    }

    .btn {
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-warning {
        background-color: #ffc107;
        color: white;
    }

    .btn-warning:hover {
        background-color: #e0a800;
    }

    .w-100 {
        width: 100%;
    }
</style>


<br><br><br>
       
        <div class="card-container">
            {% for i in data['view'] %}
            <div class="card">
                <h3>{{ i['title'] }}</h3>
                <p>{{ i['description'] }}</p>
                <video src="{{ i['file_path'] }}" controls></video>
                <p><strong>Type:</strong> {{ i['file_type'] }}</p>
                <div class="actions">
                    <button><a href="?action=update&id={{i['tutorial_id']}}">Update</a></button>
                    <button><a href="?action=delete&id={{i['tutorial_id']}}">Delete</a></button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </center>
</body>
</html>
<br><br><br><br><br><br><br><br>
