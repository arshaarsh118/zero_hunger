{% include 'farmer_header.html' %}
<br><br><br><br><br>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>view_order</title>
</head>
<body>
    <center>
        <h2>YOUR ORDERS</h2>
        <div class="container mt-4">
            <div class="d-flex flex-wrap justify-content-center">
                {% for i in data['view'] %}
                <div class="card text-white bg-dark m-2" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title">{{ i['item_name'] }}</h5>
                        <p class="card-text">
                            <strong>Quantity:</strong> {{ i['od_quantity'] }}<br>
                            <strong>Price:</strong> {{ i['item_price'] }}<br>
                            <!-- <strong>Total:</strong> {{ i['om_total'] }} -->
                        </p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        
        
    </center>
</body>
</html>
